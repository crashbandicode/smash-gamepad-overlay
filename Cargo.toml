[package]
name = "smash-gamepad-overlay"
version = "0.1.2"
authors = []
edition = "2021"

[package.metadata.skyline]
titleid = "01006A800016E000" # Super Smash Bros. Ultimate

[lib]
crate-type = ["cdylib"]

[features]
default = []
diagnostic-pane-userdata = []

[dependencies]
skyline = "0.6.0"
sgpo-ui-cache-metadata = { path = "crates/sgpo-ui-cache-metadata" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
# Size over speed. The mapped NRO is the game-heap cost; fat LTO is already on.
opt-level = "s"
debug = true
strip = "none"
