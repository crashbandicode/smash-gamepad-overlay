[package]
name = "sgpo-installer"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
nx-layout-toolbox = { package = "nx-layout-toolbox", path = "../../local-checkouts/Toolbox-Cli", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smash-arc = { version = "0.6.0", default-features = false, features = ["dir-listing", "rust-zstd"] }
walkdir = "2.5"
